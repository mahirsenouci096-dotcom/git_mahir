name: Secret scan

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan commits from this push
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -v "$PWD:/path"
          -w /path
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact
          --log-opts="$BEFORE_SHA..$AFTER_SHA"
          /path
